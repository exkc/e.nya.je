<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webOS Dualbro</title>
  <link rel="stylesheet" href="./guided-terminal.css" />
</head>
<body>
  <main class="shell">
    <section id="fileProtocolNotice" class="panel" hidden>
      <div class="panel-title">local file mode blocked</div>
    </section>

    <section class="panel">
      <div class="panel-title panel-title-split">
        <span>WebOS Dualbro</span>
        <span class="statusline"><span id="statusDot" class="dot"></span><span id="statusText">idle</span></span>
      </div>
    <div class="toolbar"> 
	    <label for="webosverion">WebOS Version :</label>
  <input type="number" id="webosverion" name="webosverion"> </div>
    <div class="toolbar"> 
	    <label for="advtoggle">Advanced Mode :</label>
  <input type="checkbox" id="advtoggle" name="advtoggle"> </div>
      <details id="advtogglede">
	      <summary class="useless"></summary>
      <div class="toolbar">
	       <label for="whichbro">Which bro you want to use :</label>
	      <select id="whichbro">
    <option value="wtf">WTFBro</option>
    <option value="js">Jsbro</option>
    <option value="dang">Dangbro</option>
    </select>
      </div>

<div class="toolbar">
	       <label for="whichapp">Which app you want to use :</label>
	      <select id="whichapp">
    <option value="auto">Autodetect (based on version)</option>
    <option value="dang">dangbei-overlay</option>
    <option value="tiny">tinybrowser</option>
    <option value="voiceweb">voiceweb</option>
    </select>
      </div>
 <div class="toolbar"> 
	    <label for="tvip">TV IP :</label>
  <input value="127.0.0.1" type="text" id="tvip" name="tvip"> </div>
 <div class="toolbar">

<label for="ssltoggle">SSL :</label>
  <input type="checkbox" id="ssltoggle" name="ssltoggle">
      </div>

      <div class="toolbar">

<label for="debugtoggle">Debug Mode (for dangbro and wtfbro) :</label>
  <input type="checkbox" id="debugtoggle" name="debugtoggle">
      </div>
</details> 
        <button class="toolbar" id="connectBtn">Root the TV :3</button>
      <p class="subline">Dualbro - A entry point for jsbro/dangbro/wtfbro.</p>
        </section>

    <section class="panel">
      <div class="panel-title">Terminal</div>
      <pre id="log" class="terminal"></pre>
    </section>

    <div class="footer-links">
      <a class="footer-link" href="https://raws0kil.github.io/jsbro-autoroot/" target="_blank" rel="noopener noreferrer">Jsbro ↗</a>
      <a class="footer-link" href="https://azoffshowy.github.io/dangbro/" target="_blank" rel="noopener noreferrer">Dangbro ↗</a>
      <a class="footer-link" href="https://github.com/exkc/e.nya.je/tree/main/getroot" target="_blank" rel="noopener noreferrer">Github source ↗</a>
      <a class="footer-link" href="https://discord.gg/hXMHAgJC5R" target="_blank" rel="noopener noreferrer">OpenLGTV Discord ↗</a>
    </div>
  </main>

  <div id="modal" class="overlay" hidden>
    <div class="dialog">
      <div id="modalTitle" class="dialog-title"></div>
      <pre id="modalBody" class="dialog-body"></pre>
      <div class="dialog-actions">
        <button class="dialog-btu" id="modalPrimaryBtn"></button>
        <button class="dialog-btu" id="modalDismissBtn"></button>
	<button class="dialog-btu" id="modalHelpBtn"></button>
      </div>
    </div>
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      document.getElementById('fileProtocolNotice').hidden = false;
    } else {
      const script = document.createElement('script');
      script.type = 'module';
      script.src = './dualbro.js';
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
